[project]
name = "pycodingagent"
version = "0.1.0"
description = "PyCodingAgent — converts natural language prompts into complete, production-ready Python projects using multiple specialized AI agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai-agents>=0.0.19",
    "python-dotenv>=1.0.0",
    "aiofiles>=24.1.0",
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
pycodingagent = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib", "pipeline", "models"]
include = ["main.py"]
